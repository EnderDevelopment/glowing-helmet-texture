<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- Basic structure of the skin -->
    <rect x="0" y="0" width="64" height="64" fill="#000000" />
    <!-- Head -->
    <rect x="16" y="0" width="32" height="32" fill="#555555" />
    <!-- Body -->
    <rect x="24" y="32" width="16" height="20" fill="#555555" />
    <!-- Arms -->
    <rect x="8" y="32" width="8" height="20" fill="#555555" />
    <rect x="40" y="32" width="8" height="20" fill="#555555" />
    <!-- Legs -->
    <rect x="16" y="52" width="8" height="12" fill="#555555" />
    <rect x="32" y="52" width="8" height="12" fill="#555555" />
    <!-- Glowing eyes -->
    <circle cx="24" cy="12" r="2" fill="#FFFFFF" />
    <circle cx="36" cy="12" r="2" fill="#FFFFFF" />
    <!-- Crown or helmet -->
    <rect x="16" y="0" width="32" height="4" fill="#FFD700" />
    <rect x="20" y="4" width="24" height="4" fill="#FFD700" />
    <rect x="24" y="8" width="16" height="4" fill="#FFD700" />
    <rect x="28" y="12" width="8" height="4" fill="#FFD700" />
    <!-- Secondary colors -->
    <rect x="20" y="16" width="4" height="4" fill="#FFFFFF" />
    <rect x="36" y="16" width="4" height="4" fill="#FFFFFF" />
    <rect x="24" y="20" width="4" height="4" fill="#ADD8E6" />
    <rect x="32" y="20" width="4" height="4" fill="#ADD8E6" />
</svg>